[project]
name = "scan-batcher"
dynamic = ["version"]
description = "A utility to automate and optimize scanning workflows using VueScan."
authors = [
    { name="Andrey Nalivayev", email="nalivayev@gmail.com" }
]
keywords = ["vuescan", "scanning", "automation", "exif", "metadata"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
scan-batcher = "scan_batcher.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "scan_batcher",
    "scan_batcher.workflows",
    "scan_batcher.workflows.patch",
    "scan_batcher.workflows.vuescan",
    "common",
]

[tool.setuptools.package-data]
"scan_batcher.workflows.vuescan" = ["*.ini"]

[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
markers = [
    "manual: manual tests excluded from regular runs (run with: pytest -m manual)",
]
addopts = "-m 'not manual'"
testpaths = [
    "tests/common",
    "tests/scan_batcher",
]
