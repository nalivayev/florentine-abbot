; Settings for workflow
;
; Drives the scanner and writes the archival master: the raw file, as the
; sensor delivered it. Everything else is made from this file -- the
; production master by the sibling "master" workflow, and every derivative
; from that. Originals here are usually borrowed and go back to their owner,
; so this is the copy that cannot be made a second time.
;
; Reference: FADGI Technical Guidelines for Digitizing Cultural Heritage
; Materials, 3rd Edition (2023), section 3.8 "Prints and Photographs".
; https://www.digitizationguidelines.gov/guidelines/digitize-technical.html
;
; That asymmetry is why this file declares as much as it does, including
; settings that happen to match VueScan's defaults today. A spoiled master is
; made again from the raw; a raw taken with a filter on, or with the frame
; split in two by the program, is not recoverable by anything.
;
; Run as:
;   scan-batcher --engine vuescan --workflow <the folder holding this file>
;     --dpis 75 100 150 200 300 400 600 800 1200 1600 2400 4800
;
; --workflow takes the directory, not the file: the name workflow.ini is
; appended by the engine itself.
;
; --dpis is the list of resolutions this scanner actually has, so the batch
; settles on a hardware step instead of a figure VueScan would have to round
; for it afterwards -- see ScanDpi below for what it does with one. The list
; was read off the Input tab.
;
; Rounding is not passed, because up is the default. The calculated figure is
; a floor -- the resolution at which the smaller side first exceeds the wanted
; pixel count -- so rounding down or to nearest would return a raw smaller
; than what was asked for.
;
; The batch defaults to Scan and is endless. On each turn it asks for the
; smaller side of the original in centimetres and the wanted pixel count,
; prints the resolutions it will choose between, takes the choice and runs
; VueScan; close VueScan and it files the raw and comes round again.
; --batch calculate does that arithmetic exactly once and scans nothing,
; which is the way to check the flags above without an original on the platen.
;
; Comments in the [vuescan.*] sections follow one rule: a block written
; directly under the section header describes the section as a whole, and a
; block separated from what precedes it by a blank line describes the key or
; the run of keys immediately below it.

[main]
; List of templates that can be used in for parameter values in the current section:
;
; scan_dpi - scan resolution chosen from the calculation table (--batch scan)
; digitization_year - year of digitization extracted from EXIF
; digitization_month - month of digitization extracted from EXIF
; digitization_day - day of digitization extracted from EXIF
; digitization_hour - hour of digitization extracted from EXIF
; digitization_minute - minute of digitization extracted from EXIF
; digitization_second - second of digitization extracted from EXIF
;
; Template format example:
;
; {digitization_year:8:>:0}
;          ^         ^ ^ ^
;          |         | | |
;          |         | | +------ placeholder character
;          |         | +-------- alignment
;          |         +---------- total length
;          +-------------------- name of the value

description = Workflow for raw scanning
output_root = d:\\scanning\\
output_folder_name = {digitization_year:4:>:0}.{digitization_month:2:>:0}.{digitization_day:2:>:0}

; The .RAW marker says what the file is, as .MSR does for the master workflow's
; files and as naming.md prescribes for both. A raw taken out of its folder
; still names itself, and the master workflow selects raws by it.
output_file_name = {digitization_year:4:>:0}.{digitization_month:2:>:0}.{digitization_day:2:>:0}.{digitization_hour:2:>:0}.{digitization_minute:2:>:0}.{digitization_second:2:>:0}.RAW
output_path = ${main:output_root}${main:output_folder_name}

[vuescan]
output_folder_name = temporary
output_file_name = temporary
output_extension_name = tif
output_path = ${main:output_root}${vuescan:output_folder_name}

[vuescan.Input]
; Input tab, the part that does not depend on the source. VueScan splits every
; tab in two: the bare name holds what is common, and <Tab>-<Source>-<Media>
; holds what is tied to a particular source on a particular medium -- here
; Input-PerfectionV850-Flatbed, this scanner on its flatbed. That is why the
; choice of source lives here and the scan settings live below, and why Output
; appears twice further down. Colour would appear twice as well; why it appears
; not at all is set out above Output.

; Professional options, the widest of VueScan's three levels -- Basic,
; Standard, Professional. Required: this whole workflow is built on
; Professional options. Output|Raw file and every one of its sub-settings --
; Raw file type, Raw output with, Raw compression, Raw size reduction, Raw DNG
; format, Raw save film -- are tagged Professional in VueScan's manual.
; https://www.hamrick.com/vuescan/html/vuesc33.htm
;
; The level only decides what the interface shows. What VueScan does with a
; key the chosen level would hide is not stated in the manual, and at the
; widest level the question does not arise.
;
; 2 is Professional. Read back: with Options = 2 written by this tool, the
; Input tab opens at Professional. The position in the manual's list pointed
; the same way, but VueScan's numbering is not reliably positional (see
; RawFileType and BitsPerPixel below), so the manual alone would not have
; settled it. The check was made with the File source: this key lives in the
; common Input section and does not depend on the source.
Options = 2

; The scanner, named rather than numbered. The master workflow writes
; Source = 0 for File input, so this key takes a number for VueScan's built-in
; sources and a name for an attached device. Confirmed by choosing the scanner
; in the interface and reading back what VueScan wrote.
;
; The same string appears in the section headings below, but the two are not
; the same thing: a heading is assembled by VueScan from the tab, the source
; and the medium, and every one of them changes if the scanner does. There is
; no Files key here -- nothing is being read from disk.
Source = PerfectionV850

[vuescan.Input-PerfectionV850]
; Input tab, the part tied to the source but not to the medium. This is a
; third shape of section name: VueScan writes <Tab>, <Tab>-<Source> and
; <Tab>-<Source>-<Medium>, and this is the middle one. Observed twice, once
; per source -- Input-File and Input-PerfectionV850 -- each holding this one
; key and nothing else.

; Reflective. The list is Reflective, Transparency, Transparency 8x10,
; numbered 0 to 2: choosing Transparency writes Mode = 1 here, and returning
; to Reflective makes the key vanish, which is how VueScan records its own
; default.
;
; Declared because it decides whether the rest of this file applies at all.
; The medium is the third token of every other section heading below, so in
; transparency mode VueScan reads Input-PerfectionV850-Transparency and
; Crop-PerfectionV850-Transparency -- headings this workflow never writes --
; and every prohibition in it stops applying without a word.
Mode = 0

[vuescan.Input-PerfectionV850-Flatbed]

; Orientation: nothing here may alter the frame. All four are VueScan's own
; defaults today -- choosing "no rotation" and clearing the two checkboxes
; makes every one of them vanish from the settings file, and AutoSkew turned
; out to be a default too. They are declared regardless: this file is written
; from scratch on every run, and the raw is the copy everything else is made
; from.
;
; Measured at this scanner. Rotation is the list None, Left, Flip, Right,
; Auto, numbered 0 to 4. AutoFlip and Mirror are checkboxes and write 1 when
; on.
;
; FADGI 2.4.12 permits rotation correction outright, so this is not a
; principle but a question of where the work is done. A rotation here
; interpolates every pixel of the archival copy; the same rotation applied to
; a derivative leaves the record intact. Straightness is achieved by laying
; the photograph down straight, and automatic skew or rotation is in any case
; a guess at the angle from the content.
Rotation = 0
AutoFlip = 0
Mirror = 0
AutoSkew = 0

; Sixteen readings of each line, averaged. This is averaging, not filtering:
; it lowers sensor noise by measuring the same light more times, rather than
; by smoothing the image afterwards, so nothing is invented and nothing is
; removed. Sixteen is the archival setting -- it costs scan time on every
; original and buys a cleaner first copy, and the first copy is the one that
; cannot be made again.
NumberOfSamples = 16

; Colour, and for black and white originals too. FADGI 3.8 requires 16-bit
; colour of masters at three stars and above, including originals that are
; themselves monochrome -- the paper's own tone and its stains are part of the
; record. Grayscale here would throw that away at capture, where nothing can
; put it back.
;
; Measured at this scanner. The list is Colour, Grayscale, Colour text,
; B/W text, Auto, numbered 0 to 4: selecting Grayscale writes Media = 1, and
; restoring Colour makes the key vanish, so Colour is also VueScan's default.
; Auto is the last item, not the first.
;
; Declared even though it is the default: this is a requirement rather than a
; convenience, and the settings file is written from scratch on every run.
;
; AutoMedia is not declared. It appears and disappears together with Media,
; and what it governs has not been established.
Media = 0

; Maximum. This key sets a ceiling on the frame, and "maximum crop" means the
; maximum within it -- not the maximum the glass can reach.
;
; Measured. With Crop|CropSize at Maximum and this key at Credit card, VueScan
; wrote a frame of 10201 x 16176; at A4 the same frame was 39685 x 56126. The
; unit is pixels at 4800 dpi, so those are 54 x 85.6 mm and 210 x 297 mm --
; the card and the sheet, to the millimetre. The interface gives no sign of
; it: the crop control reads "Auto (Maximum)" at either setting.
;
; A4 is not the platen, and A4 is VueScan's default here -- it writes nothing
; while the key stands at A4 and writes MediaSize = 0 when Maximum is chosen,
; which is how it records a value of its own. The glass on this scanner is
; 216 mm wide, so a workflow that leaves this key alone cannot reach the last
; six millimetres of it, and nothing anywhere says so. Verified from the other
; end: at Maximum the frame centre moves to 20399, twice which is 215.9 mm.
;
; 0 is Maximum, the first item of the list. The numbering is positional:
; Credit card sits twenty-third and wrote 22.
MediaSize = 0

; Save when a scan finishes. The manual: "if this option is set to 'Preview'
; or 'Scan', VueScan will save files after a preview or scan is completed".
; https://www.hamrick.com/vuescan/html/vuesc29.htm
;
; Measured here: the list is None, Preview, Scan, numbered 0 to 2. Choosing
; Preview writes AutoSave = 1 and choosing Scan makes the key vanish, so Scan
; is VueScan's default.
;
; Declared because the other two values break a run, and not in the same way.
; At None nothing is written at all: the engine waits for VueScan to close,
; finds no file and stops, with the scan already made. At Preview the file is
; written after the preview pass instead -- so what waits in the temporary
; folder is a preview, and the engine has no way to tell. It would be filed as
; the archival master under its proper name, at preview resolution.
AutoSave = 2

; 48 bit RGB, i.e. 16 bits per channel, as FADGI 3.8 asks of a master.
;
; Measured at this scanner: the list is Auto, 1 bit B/W, 8 bit gray, 16 bit
; gray, 24 bit RGB, 48 bit RGB, 64 bit RGBI, numbered 0 to 6, so 48 bit RGB
; is 5. Worth comparing with Output|RawFileType, which offers the same labels
; in a list where Auto comes last instead of first and 48 bit RGB is 4. Two
; adjacent lists, one label, two numbers: neither value could be carried over
; from the other, and neither from the master workflow's file source.
BitsPerPixel = 5

; "Set by the user". This is the item that makes ScanDpi below exist at all:
; the rest of the list are fixed steps, and only this one opens a field for
; typing a resolution. The two keys are therefore one decision.
;
; It is required rather than convenient. The Scan batch works out a resolution
; for each original, and that number is not obliged to land on one of the
; steps the scanner offers.
;
; Measured here: Auto, Set by the user, 4800, 2400, 1600, 1200, 800, 600, 400,
; 300, 200, 150, 100, 75, numbered from 0, so this is 1. The list is not the
; one the master workflow sets out for a file source -- that one has 960 and
; 686 dpi and stops at 600 -- which is one more reason the two workflows
; cannot borrow numbers from each other.
;
; Auto is not "the resolution of the original": for a reflective scan it is
; 600 dpi, so leaving these two keys out would quietly fix every raw at 600.
ScanResolution = 1

; Filled by the Scan batch from the operator's choice: the lowest resolution
; the scanner offers at which the smaller side of the frame still exceeds the
; required pixel count, and the top of the list only when the requirement runs
; past its end. Decided per original, while the original is still on the
; platen.
;
; The number is a request, not a contract. A run asking for 304 dpi produced a
; file whose header reads 400 -- the next hardware step up. That stands to
; reason for a raw: a raw is what the sensor read, the sensor has only its own
; steps, and reaching an arbitrary figure between them would take resampling,
; which is processing and does not happen to a raw at all.
;
; Harmless here, because rounding can only go up and the rule above only ever
; sets a floor. It does mean the file's resolution has to be read from the
; file rather than from this key -- see metadata.md, which says the same and
; draws the same conclusion for validation.
;
; VueScan's manual states the rule outright: with a resolution set by the
; user, the scanner uses "a hardware-supported resolution that is greater than
; or equal to this value".
; https://www.hamrick.com/vuescan/html/vuesc29.htm
;
; Passing the list above to the Scan batch as --dpis makes it choose a
; hardware step in the first place, and nothing is rounded at all.
ScanDpi = {scan_dpi}

[vuescan.Crop-PerfectionV850-Flatbed]
; Crop tab. The frame itself is deliberately not declared: in raw scanning the
; operator sets it per original on the preview, and a fixed CropSize would
; take that away. Only the two controls that can damage the file behind the
; operator's back are declared here.

; No border. Measured at this scanner: 20 in the interface is written as
; 20000, so the scale is the setting times 1000 and 0 means no border. It is
; not inert -- on the master side a border of 12 added 12% of the frame width
; on each of the four sides, pixels that were never on the platen.
Border = 0

; Multi crop off, and this line is load-bearing. Measured at this scanner:
; selecting Off writes MultiCrop = 0, and selecting On makes the key vanish
; from the settings file, which is how VueScan records its own default. Multi
; crop is therefore ON by default here, and left undeclared it stays on -- one
; scan silently split into several files by the program's guess at where the
; edges of a photograph are. Checked in both crop modes, Auto and set-by-user,
; with the same result.
;
; The same control defaults the other way for a file source: selecting Off in
; Crop-File-Flatbed writes nothing at all. So the defaults differ by source,
; and one section cannot be reasoned out from another -- each has to be
; measured on its own.
MultiCrop = 0

; CropSize, Skew, XCenter, YCenter, XSize, YSize and Buffer are not declared.
; Auto is VueScan's default for CropSize -- selecting it makes the key vanish,
; and 0 is "set by the user". Skew and the four X/Y keys are written only
; while the frame is set by the user and disappear at Auto. Their scale is not
; the one Border uses: with the interface showing 500, XCenter was written as
; 94488.

[vuescan.Filter-PerfectionV850-Flatbed]
; Filter tab, every filter off. These are FADGI's prohibition list almost one
; for one: removal of blemishes, dust and scratches (grain reduction), digital
; infill (hole punch removal), blurring (flatten), colour restoration (restore
; fading, restore colours), over sharpening (sharpen), colorization.
;
; Key names and the section name were read back from a settings file written
; by VueScan with every filter on this tab switched on, at this scanner on the
; flatbed. Two names that exist elsewhere in VueScan are absent: InfraredClean
; and AllFrames. Infrared cleaning needs an infrared channel and the flatbed
; has none for a reflective original, so the control is not on the tab at all
; and the key cannot be declared even in order to forbid it.
;
; Three of the eight are checkboxes (restore colours, descreen, hole punch
; removal) and five are lists carrying a strength: switched on, VueScan wrote
; GrainReduction = 3, Sharpen = 3, Flatten = 2 and the rest 1. So zero had to
; be established rather than assumed -- VueScan never writes the off state,
; because the off state is its default.
;
; Read off the two lists that matter. Flatten is Off, On, Auto = 0, 1, 2, and
; it had written 2, i.e. Auto. GrainReduction is No, Light, Medium, Heavy =
; 0, 1, 2, 3, and it had written 3, i.e. Heavy. Both number positionally and
; both put the off state first, as do the remaining three lists.
;
; By the manual none of this reaches a raw file: filter options "do not affect
; the data of a raw scan file". The single exception is Output|RawOutputWith
; set to Save, which bakes in grain reduction and infrared cleaning -- and
; that key is declared as Scan above, while infrared cleaning does not exist
; here at all. So of these eight only GrainReduction could ever have touched
; the file, and only under a setting this file forbids.
;
; Declared regardless. It costs eight lines, the settings file is written from
; scratch on every run, and a filtered raw cannot be unfiltered.
GrainReduction = 0
Descreen = 0
HolePunchRemoval = 0
Flatten = 0
RestoreFading = 0
RestoreColors = 0
Sharpen = 0
Colorize = 0

; DescreenDpi and AutoRestoreFading are not declared. VueScan wrote them
; alongside their parents (DescreenDpi = 90, AutoRestoreFading = 1), but they
; are sub-settings of Descreen and RestoreFading and do nothing while those
; are off.

; There is no Color section in this file, and its absence is deliberate.
;
; VueScan states that colour settings are not applied to raw files, and that
; was measured rather than taken on trust. The same original was scanned three
; times at 300 dpi: once as it stood, once with brightness at maximum, and
; once with brightness at maximum and Output|RawSaveFilm switched on as well.
; The channel means never moved outside about one per cent, and not even in
; one direction -- red down, blue up -- where a brightness multiplier would
; have driven them towards the top of the range and flattened the medians
; against it.
;
; One per cent is therefore the ordinary difference between two passes over
; the same original, and also the floor of what this method can detect.
;
; The sharper finding is what the settings file said meanwhile. Brightness at
; maximum was written into it as Color-PerfectionV850-Flatbed|Brightness =
; 10000 and stayed there through all of it. A key being stored is not a key
; being applied, and only the pixels settle which of the two happened.
;
; The result holds for the settings this file declares -- Output|RawOutputWith
; at Scan, Output|RawSaveFilm off -- and those are the two keys that VueScan's
; manual says can carry processing into a raw. It was tested on a reflective
; original; film is a different question and has not been asked.
;
; The consequence is that nothing belongs here: no output colour space, no ICC
; profile, no PixelColors. The master workflow declares all three, because
; there the colour settings do reach the file.

[vuescan.Output]

; At which operation the raw file is written. Save = 0, Preview = 1,
; Scan = 2. Established at the scanner by elimination: Save and Preview write
; their numbers into vuescan.ini, Scan is VueScan's own default and is
; therefore never written at all -- selecting it makes the key vanish from the
; file, which is how the value 2 was read off.
;
; This is not a question of timing alone. The manual says filter options "do
; not affect the data of a raw scan file", and then gives one exception: "if
; Output | Raw output with is set to 'Save' - in this case, the infrared
; cleaning and grain reduction is also done before saving the raw scan files".
; So Save bakes two filters into the archival file, and nothing later can take
; them out. https://www.hamrick.com/vuescan/html/vuesc31.htm
;
; Preview is wrong for an unrelated reason: the preview is its own pass and
; does not run at ScanDpi.
;
; Declared rather than left at the default. The default is right today, but
; the cleanliness of the archive should not rest on another program keeping
; it, and this file is written from scratch on every run anyway.
RawOutputWith = 2

; 48 bit RGB, i.e. 16 bits per channel, as FADGI 3.8 requires of a master.
; Verified at the scanner in both directions: with 4 in the file VueScan shows
; "48 bit RGB", and selecting "24 bit RGB" writes 3. The list is positional --
; 1 bit B/W, 8 bit gray, 16 bit gray, 24 bit RGB, 48 bit RGB, 64 bit RGBI,
; 16 bit Infrared, Auto -- so 4 is the fifth item.
;
; The manual advises Auto here ("defaults to bits per pixel of the scanner"),
; and Auto is the last item, not the first. It would give 48 bit on this
; scanner, but it states the depth nowhere and would follow the hardware if
; the hardware changed. The archival depth is a requirement, so it is named.
RawFileType = 4

; Maximum, which is lossless. Verified at the scanner: the list is Off,
; Standard, Maximum, numbered 0, 1, 2, and selecting Standard makes the key
; vanish from vuescan.ini, which is how VueScan records its own default.
;
; That default is the reason this key cannot be left out. Standard compresses
; only files of 12 or fewer bits per sample; at the 16 bits set above it
; leaves the file uncompressed altogether. Undeclared, every raw here would be
; written without compression.
RawCompression = 2

; Full size. The key divides the pixel count of the raw before it is written;
; the interface calls it "Raw size reduction" and 1 means no reduction.
; Measured at this scanner: it is a plain integer, not the times-a-thousand
; scale used on the Crop and Colour tabs, and it is absent from the settings
; file at 1, which is VueScan's default.
;
; Declared because of what it costs when it is wrong. This is neither a filter
; nor a colour setting: it removes pixels from the archival copy at the moment
; of capture, and no later step can put them back.
RawSizeReduction = 1

; TIFF, not DNG. Measured here: switching it on writes RawDNGFormat = 1 and
; VueScan at once rewrites the output name from temporary.tif to
; temporary.dng. The engine looks for the name this workflow gave it and
; nothing else, so the run would end in "output file not found" -- after the
; scan had already been made and the original taken off the platen.
RawDNGFormat = 0

; Film corrections are not written into the raw. VueScan's manual: "if this
; option is set, then the film corrections are done before the raw file is
; written".
;
; Tested here with this key on and brightness at maximum at the same time: the
; channel means did not move outside the ordinary one per cent that separates
; any two passes over the same original. So on a reflective original it
; changes nothing, which is what the name says.
;
; Declared regardless, and the reason is not symmetry. The day this workflow
; is pointed at the transparency unit, "film" stops being decorative and the
; key starts writing corrected data into the archival file.
RawSaveFilm = 0
; Where VueScan puts the raw and what it calls it. Both are the temporary
; name, not the final one: VueScan cannot know the final name, which is built
; from the EXIF of the file it has not written yet. The engine reads that EXIF
; afterwards and files the raw itself, under main|output_file_name.
;
; Stated once, here. The same two keys used to be declared in
; Input-PerfectionV850-Flatbed as well; removing them changed nothing -- a run
; with and a run without produced the same file in the same place -- so the
; pair in the Input section was carrying nothing.
DefaultFolder = ${vuescan:output_path}
RawFileName = ${vuescan:output_file_name}.${vuescan:output_extension_name}

[vuescan.Output-PerfectionV850-Flatbed]
; Output tab, the part tied to this source: which files a run produces. It has
; to produce exactly one. The engine takes a single name out of the temporary
; folder and moves that file and no other, so anything else VueScan writes
; there simply stays -- nothing cleans that folder and nobody looks in it. The
; VueScan guide arrives at the same instruction for its own reasons: "In the
; Output tab un-check all the options except for Output | Raw file".
; https://www.hamrick.com/vuescan/html/vuesc15.htm

; The raw file, and the only file this workflow exists to make.
RawFile = 1

; PDF off -- and of the seven prohibitions here this is the only one that is
; not belt and braces. Measured at the scanner: with the PDF box ticked in the
; interface the key is absent from vuescan.ini, and VueScan omits only what
; matches its own default, so PDF output is on by default at this source.
; Undeclared, every raw scan would be accompanied by a PDF of itself.
;
; The absence of the key alone does not show this -- it would look the same if
; the box had never been ticked -- so the state of the checkbox was read off
; the interface at the same time. OCRTextFile below is why that mattered: on
; the first sweep it failed to appear for exactly that reason.
PDFFile = 0

; The remaining six are off by default and declared regardless: the settings
; file is written from scratch on every run, and each extra format means a
; second pass over a 500-megapixel 16-bit image on every original. The names
; were read back from a settings file written with every box on this tab
; ticked, at this scanner on the flatbed. Two are not what the interface
; suggests -- the OCR key is OCRTextFile, not OCRFile, and PNG and JPEG XL
; exist as outputs although the manual's list does not mention them.
TIFFFile = 0
JPEGFile = 0
PNGFile = 0
JPEGXLFile = 0
IndexFile = 0
OCRTextFile = 0
