; Settings for workflow
;
; Produces a FADGI production master from a raw scan made by the sibling
; "raw" workflow. The raw file is an archival master: linear, unadjusted,
; device RGB, no profile. This workflow renders it into a delivery-neutral
; master with a known colour space and an embedded profile.
;
; Reference: FADGI Technical Guidelines for Digitizing Cultural Heritage
; Materials, 3rd Edition (2023), section 3.8 "Prints and Photographs".
; https://www.digitizationguidelines.gov/guidelines/digitize-technical.html
;
; Target level: 3 stars. Four stars is out of reach for a flatbed on the
; measured parameters (SFR sampling efficiency, noise, colour accuracy),
; and FADGI itself cautions against claiming it (guidelines, p. 11).
; The settable parameters below are nevertheless at 4-star values.
;
; Run as:
;   scan-batcher --batch process <raw folder> RAW.tif --engine vuescan --workflow <the folder holding this file>
;
; --workflow takes the directory, not the file: the name workflow.ini is
; appended by the engine itself.
;
; The filter selects raws by name: the raw workflow ends every file name with
; .RAW, so RAW.tif picks up raws and nothing else that may lie in the folder.
; A filter without *, ? or [ is an ending of the name, a filter with them is a
; glob, and a filter that selects nothing is reported with a warning.
;
; Comments in the [vuescan.*] sections follow one rule: a block written
; directly under the section header describes the section as a whole, and a
; block separated from what precedes it by a blank line describes the key or
; the run of keys immediately below it.

[main]
; List of templates that can be used in for parameter values in the current section:
;
; filename - name of the current file from the batch, with extension
; path - full path to the current file from the batch
; digitization_year - year of digitization extracted from EXIF
; digitization_month - month of digitization extracted from EXIF
; digitization_day - day of digitization extracted from EXIF
; digitization_hour - hour of digitization extracted from EXIF
; digitization_minute - minute of digitization extracted from EXIF
; digitization_second - second of digitization extracted from EXIF
;
; Template format example:
;
; {digitization_year:8:>:0}
;          ^         ^ ^ ^
;          |         | | |
;          |         | | +------ placeholder character
;          |         | +-------- alignment
;          |         +---------- total length
;          +-------------------- name of the value

description = Workflow for making a master copy from a raw scan

; Backslashes are doubled, and must be. ConfigParser passes them through
; untouched (it has no backslash escaping of its own -- with
; ExtendedInterpolation the escape character is "$"), so what is written here
; is what VueScan reads, and in VueScan's settings format the backslash is an
; escape character. Its own file writes c:\\temp\\... Python's use of these
; values is unaffected: pathlib collapses the repeated separator.
output_root = e:\\scanning\\
output_folder_name = {digitization_year:4:>:0}.{digitization_month:2:>:0}.{digitization_day:2:>:0}
output_file_name = {digitization_year:4:>:0}.{digitization_month:2:>:0}.{digitization_day:2:>:0}.{digitization_hour:2:>:0}.{digitization_minute:2:>:0}.{digitization_second:2:>:0}.MSR
output_path = ${main:output_root}${main:output_folder_name}

[vuescan]
output_folder_name = temporary
output_file_name = temporary
output_extension_name = tif
output_path = ${main:output_root}${vuescan:output_folder_name}

; IT8 profile built for this scanner. It is an *input* transform: it tells
; VueScan how to read the device RGB of the raw. It is not what gets
; embedded in the output -- that is Color|OutputColorSpace below.
;
; The path is a placeholder and has to be pointed at a real profile. Note
; that it is a per-batch value, not a constant of the installation: the
; profile is rebuilt from an IT8 target about once per box of originals, so
; it must name the profile made for the batch being processed.
scanner_icc_profile = c:\\temp\\scanner.icc

[vuescan.Input]
; Input tab, the part that does not depend on the source. VueScan splits
; every tab in two: the bare name holds what is common, and
; <Tab>-<Source>-<Media> holds what is tied to a particular source on a
; particular medium -- here Input-File-Flatbed, the File source on a flatbed.
; That is why the choice of source lives here and the scan settings live
; below, and why Color and Output each appear twice further down.

; Professional mode. Required: TIFFProfile below is a Professional option.
Options = 2

; File input. VueScan itself writes 0 here while the GUI shows "File",
; verified by round-trip through the settings file.
Source = 0

; Input file: the full path of the current file from the batch, so that the
; source folder is stated once, on the command line, and not repeated here.
; The key is "Files", not "TIFF file name" -- the latter exists in this
; section too and means something else. Confirmed by picking the file in the
; GUI and reading back what VueScan wrote; an absolute path is accepted
; verbatim.
Files = {path}

[vuescan.Input-File-Flatbed]
; Input tab, the part tied to reading a file on a flatbed: what the source is
; taken to be, and at what depth and resolution it is read.

; Media: Image. For a reflective original this states that the result is
; colour and continuous tone, as against black/white or bi-level text.
;
; Not cosmetic here. Color|ColorBalance below is None, and the manual
; describes what None then does as correcting "for the CCD's color response
; (if the Media option is set to Image) or by the film's color response".
; Image is the setting under which None means what this workflow needs it
; to mean.
Media = 0

; 48 bit RGB, i.e. 16 bits per channel. FADGI 3.8 requires 16 bit at
; 4 stars, and the section text requires 16-bit *colour* for all masters
; at 3 stars and above, including originals that are black and white.
BitsPerPixel = 5

; "Custom", i.e. the resolution is taken from ScanDpi below. Confirmed by
; round-trip: picking that item in the GUI writes 1 here.
;
; The list, in order, is Auto, Custom, 4800, 2400, 1600, 1200, 960, 800,
; 686, 600 dpi, and VueScan numbers it positionally -- 0 to 9. It is the
; same list for a file source as for the scanner, and it holds no "same
; resolution as the source" item. Auto is not one: the manual says it picks
; "a resolution ... based on whether it's a reflective scan or a film scan",
; and for a reflective original that is 600 dpi, which is exactly what a
; test run with both keys absent produced. Auto is VueScan's default here,
; so leaving these two keys out does not pass the source resolution
; through -- it silently resamples every master to 600.
ScanResolution = 1

; This number must equal the resolution of the source file. Anything higher
; and VueScan interpolates: a raw made at 2400 ppi comes out as a 4800 ppi
; master four times the size with not one pixel more information in it.
;
; 4800 is the optical limit of this scanner on reflective originals (the
; 6400 dpi lens is selected only for film in a holder), so it is right only
; for raws that were made at that limit. Raws are not all made there: the
; resolution is chosen per original, as the lowest one the scanner offers
; that still clears the required pixel count, and 4800 only when the
; requirement runs past the end of that list.
;
; So this key wants a template carrying the source file's resolution, and
; there is none: the engine reads EXIF from the scan it produces, never from
; the file it was given. Until that exists, the number has to be set by hand
; to match the raws being processed.
;
; Both keys have to be stated regardless, and neither default is benign.
; Leave ScanResolution out and it is Auto, which means 600 (see above).
; Leave ScanDpi out with ScanResolution at Custom and it is 300 -- measured:
; typing 300 into the GUI field made VueScan drop the key from the file
; altogether, which is how it records a value that matches its default.
ScanDpi = 4800

; No automatic deskew: rotation is a transformation of the record.
AutoSkew = 0

[vuescan.Crop-File-Flatbed]
; Crop tab. Three keys decide what area of the source reaches the master and
; how many files it becomes, and all three are live at every setting of the
; other two. All three are declared.

; Whole frame. Left undeclared, VueScan crops on its own: the first test run
; came back at 90.0% of the width and 93.9% of the height of the source,
; about a centimetre gone off the long side. A master is the record of what
; was on the platen, so the crop is fixed at maximum.
;
; XCenter, XSize, YCenter and YSize are not declared: VueScan recomputes them
; from the source once CropSize is at maximum.
CropSize = 1

; No border, and this one is not inert at maximum crop. The manual says the
; added border is "limited by the size of the preview area", which would make
; it harmless here; measurement says otherwise. With Border at 12 a source of
; 18520 x 27076 at 4800 ppi, rendered to 300 ppi, came out 1435 x 1970 rather
; than the 1157 x 1692 it should be: 139 px added on each of the four sides,
; that being 12% of the *width*, applied to both axes alike. The frame grows
; 24% across and 16% down, and what fills the growth was never on the platen.
;
; Value is the setting times 1000, the same scale as the Colour tab -- the
; GUI's 12 was written here as 12000.
Border = 0

; Multi crop off. Like Border it is shown at every CropSize, and it decides
; how many frames come out of one scan at all.
;
; Three settings, not the two the manual describes ("Multi crop ... is just
; enabled or disabled"): Off, On and Grid. On is the one the manual means --
; "multiple crop boxes will be automatically found if a preview contains
; multiple images" -- and Grid divides the platen into a fixed lattice,
; bringing with it six keys of its own (XImages, YImages, XSpacing, YSpacing,
; XPadding, YPadding) that exist only while it is selected and are therefore
; not declared here.
;
; Off is 0. Established by elimination rather than assumed: On writes 1 and
; Grid writes 2, and the third value never appears in the file because it is
; the default and VueScan omits defaults. Worth the trouble -- the numbering
; is not reliably positional (Color|ScannerColorSpace below writes 0 for the
; second item in its list), so a guessed 0 here could have meant On, and a
; line written to forbid multi crop would have switched it on instead.
;
; One original goes on the platen at a time here, so there is nothing to
; find. What On would find is a guess about where the edges of a photograph
; are, and acting on it splits one master into several files.
MultiCrop = 0

; Buffer is not declared. The manual scopes it to the computation of the
; colour balance, and Color|ColorBalance below is None, so it has nothing to
; act on. Skew is not declared either: VueScan shows it only while CropSize
; is Manual.

[vuescan.Filter-File-Flatbed]
; Filter tab. Every filter off, declared rather than left to VueScan's
; defaults. These eight controls are the prohibition list of FADGI
; (guidelines, p. 4) almost one for one: removal of blemishes, dust and
; scratches (grain reduction), digital infill (hole punch removal), blurring
; (flatten), colour restoration (restore fading, restore colours), over
; sharpening (sharpen), colorization (colorize). A master is the record of
; what was on the platen; every one of these replaces part of that record
; with a guess.
;
; Key names and section name taken from a settings file written by VueScan
; with all of these switched on. VueScan's defaults are off, so an undeclared
; filter would be off today -- but this file is written from scratch on every
; run, and the prohibition list is not something to leave to another
; program's defaults.
GrainReduction = 0
Descreen = 0
HolePunchRemoval = 0
Flatten = 0
RestoreFading = 0
RestoreColors = 0
Sharpen = 0
Colorize = 0

; Not declared: DescreenDpi, AutoFlatten and AutoRestoreFading. They are
; sub-settings of Descreen, Flatten and RestoreFading and do nothing while
; those are off. InfraredClean and AllFrames are absent too: VueScan does not
; write them for a flatbed reading from a file.

[vuescan.Color-File-Flatbed]
; Colour tab, the part tied to the source: how the device RGB of the raw is
; to be read, and what is done to its tones on the way out. The output space
; itself is not here -- it does not depend on the source, so it sits in
; [vuescan.Color] below.

; Colour balance: None. Confirmed by round-trip -- picking it in the GUI
; writes 0 here. The manual describes the choice as: "The black and white
; points aren't used at all, and the image is only corrected for the CCD's
; color response ... This image is gamma corrected."
; https://www.hamrick.com/vuescan/html/vuesc32.htm
;
; That is the whole of what a master derivation should do: the response of
; the device, then the transfer curve of the output space. Every other
; choice in the list applies a per-image adjustment guessed from the
; histogram.
;
; It also disposes of the black and white points, and that matters. VueScan
; defaults the white point to 1%, i.e. "the brightest 1% of pixels are all
; converted to pure white" -- which FADGI names outright as damage, of
; scanners "set at the default to force the paper of the original document
; to pure white in the image, clipping all the texture and detail in the
; paper (not desirable for most originals in collections of cultural
; institutions)" (guidelines, 7.4). With None the two fields are not merely
; ignored: they are absent from the Colour tab altogether. So BlackPoint and
; WhitePoint are not declared below -- there would be nothing for them to
; describe. Neither are NeutralRed/Green/Blue, which VueScan shows only when
; the balance is Manual.
ColorBalance = 0

; The rest of the Correction group, which None does not switch off: these
; stay live at every balance setting. They are what FADGI warns against --
; "tools with less control that act globally ... more likely to compromise
; data, such as clipping tones" (guidelines, p. 87) -- and a saturation
; multiplier on a master is a guess substituted for the record, no different
; in kind from Colorize on the Filter tab.
;
; Values are the setting times 1000: 250 is 0.25, 1000 is 1.0.
;
; Every number here restates a VueScan default. The curve at 0.25/0.75 is
; the identity -- Image | Curve graph draws a straight diagonal -- and the
; three brightnesses and the saturation are at 1.0. They are declared for
; the same reason the Filter tab is: this file is written from scratch on
; every run, and a tone curve, a gamma multiplier and a saturation
; multiplier are not things to leave to another program's defaults.
CurveLow = 250
CurveHigh = 750
Brightness = 1000
BrightnessRed = 1000
BrightnessGreen = 1000
BrightnessBlue = 1000
Saturation = 1000

; The input transform, in two keys that are one decision: which space the
; device RGB of the raw is read as, and the profile that defines that space.
; Setting the first to "ICC profile" is what makes the second mean anything.
;
; VueScan writes 0 for that choice while the GUI shows "ICC Profile" -- the
; numbering is not positional, and 1 would switch the profile off. The path
; is stated once in [vuescan] at the top of this file, where it is also
; explained: it is a per-box value rather than a constant of the
; installation, and it has to be pointed at a real profile before a run.
ScannerColorSpace = 0
ScannerICCProfile = ${vuescan:scanner_icc_profile}

[vuescan.Color]
; Colour tab, the part that does not depend on the source: what the master is
; written in, and what the operator is shown while it is made.

; Output colour space: Adobe RGB (1998). Permitted by FADGI 3.8 at every
; star level, including 3 and 4 where sRGB no longer is.
OutputColorSpace = 1

; "Pixel colors" on the Colour tab, a Professional option. It is a parent
; switch: turning it on enables four markers -- clipped black colour, clipped
; white colour, out of gamut colour, and infrared defect colour. The VueScan
; manual states of each that "these colored pixels are not written to output
; files, but are displayed in the Preview and Scan tabs", so this setting
; changes what the operator sees and nothing in the file.
; https://www.hamrick.com/vuescan/html/vuesc32.htm
;
; On by deviation from VueScan's default, and declared here on purpose.
; VueScan runs interactively on every item of the batch, so the operator is
; already looking at that preview, and the two clipping markers report the
; one failure this workflow cannot otherwise detect: detail lost at the ends
; of the tone scale, which no later step can put back.
PixelColors = 1

[vuescan.Output-File-Flatbed]
; Output tab, the part tied to the source: which file types a run produces.
; It has to produce exactly one. The engine takes a single name out of the
; temporary folder -- _prepare_output_file assembles vuescan:output_path plus
; temporary.tif, and _move_files moves that file and no other -- so anything
; else VueScan writes there simply stays: nothing cleans that folder, nothing
; lists it, and nobody looks in it. Add to that a second pass over an
; 18520 x 27076 image at 16 bits for every extra format, on every item of the
; batch.
;
; The master itself, and the only file this workflow is here to make. What it
; is written as -- depth, compression, embedded profile -- is set further down
; in [vuescan.Output], which is where VueScan keeps the how as against the
; whether.
TIFFFile = 1

; Everything else off. Key names read back from a settings file written by
; VueScan with every output checkbox ticked. Two surprises in it: the OCR key
; is OCRTextFile, not OCRFile, and PNG and JPEG XL exist as outputs although
; the manual's list does not mention them. Guessing any of these was not an
; option -- see ScannerColorSpace and MultiCrop for what VueScan's numbering
; and naming are worth.
;
; PDFFile may not belong in this list at all. Measured later at the scanner,
; in the sibling raw workflow's section Output-PerfectionV850-Flatbed, PDF
; output turned out to be VueScan's own default: with the box ticked in the
; interface the key is absent from the settings file. There this line is not
; belt and braces but the thing that stops a PDF being written beside every
; scan. Whether the default is the same for a file source has not been
; checked, and this is a different section.
PDFFile = 0
JPEGFile = 0
PNGFile = 0
JPEGXLFile = 0
IndexFile = 0
OCRTextFile = 0

; RawFile is not declared. With every checkbox ticked VueScan wrote JPEGFile,
; PNGFile, JPEGXLFile, IndexFile and OCRTextFile and no RawFile at all: there
; is no raw output on offer when the source is itself a file, which stands to
; reason -- a raw is what the sensor delivered, and this run has no sensor.
; The sibling "raw" workflow, which does, sets RawFile = 1 in the matching
; section of its own.

[vuescan.Output]
; Output tab, the part that does not depend on the source: where the master
; goes, what it is called, and how it is written.

; Where VueScan puts the result and what it names it. Both are deliberately
; the temporary name, not the final one: VueScan cannot know the final name,
; which is assembled from the EXIF of the file it has not written yet. The
; engine reads that EXIF afterwards and files the master itself.
DefaultFolder = ${vuescan:output_path}
TIFFFileName = ${vuescan:output_file_name}.${vuescan:output_extension_name}

; 48 bit RGB, confirmed against the GUI. Matches BitsPerPixel above: a
; 16-bit input rendered into an 8-bit output would throw away exactly what
; FADGI 3.8 asks a master to keep.
TIFFFileType = 4

; "Maximum" in the GUI, which selects Deflate (ZIP) -- lossless, and allowed
; for masters by FADGI 2.5.3 ("such as LZW and JPEG 2000", an open list).
; Not a matter of taste: the default, "Standard", applies LZW only to files
; of 12 or fewer bits per sample and leaves deeper ones uncompressed, so at
; the 16 bits set above "Maximum" is the only setting under which the master
; is compressed at all. https://www.hamrick.com/vuescan/html/vuesc33.htm
TIFFCompression = 2

; "TIFF profile" in the GUI, confirmed by toggling the checkbox. Embeds the
; output ICC profile. Without it the file carries Adobe RGB pixels with no
; statement of that fact, and any reader without the profile renders them
; as sRGB. VueScan defaults this to on, but the setting is half of the
; OutputColorSpace decision above and is declared here rather than left
; to a default.
TIFFProfile = 1
